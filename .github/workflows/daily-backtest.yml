name: Daily Backtest

on:
  schedule:
    - cron: "0 4 * * *"     # 04:00 UTC daily
  workflow_dispatch:

jobs:
  daily-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run quick backtest (synthetic data)
        run: |
          python scripts/quick_backtest.py --strategy B --days 365
          python scripts/quick_backtest.py --strategy A --days 365

      - name: Run historical simulation (cached)
        env:
          BINANCE_API_KEY:    ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          python scripts/run_historical_simulation.py \
            --symbol BTCUSDT --strategy B --years 2
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-backtest-${{ github.run_number }}
          path: reports/historical/
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Daily backtest failed — check artifacts for details"
