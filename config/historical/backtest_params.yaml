## CENTINA v5.0 — Backtest Engine Configuration

engine:
  capital_initial: 200.0
  fee: 0.001           # 0.1% per leg
  slippage: 0.0005     # 0.05%
  max_positions: 3
  warmup_bars: 220     # minimum bars before first trade

oco:
  tp1_pct: 2.5         # +2.5% → close 50% qty
  tp2_pct: 5.2         # +5.2% → close 30% qty
  tp3_trail_atr_mult: 1.5   # trailing stop on remaining 20%
  sl_atr_mult: 1.0     # SL at entry - 1×ATR

strategies:
  A:  # Breakout Momentum
    ema_fast: 5
    ema_slow: 20
    ema_long: 50
    ema_trend: 200
    rsi_low: 55
    rsi_high: 75
    vol_spike: 2.0
    atr_sl_mult: 1.2
    atr_tp1_mult: 1.8

  B:  # Golden Cross
    ema_fast: 7
    ema_slow: 25
    ema_long: 99
    ema_trend: 200
    rsi_low: 50
    rsi_high: 72
    vol_spike: 1.5
    atr_sl_mult: 1.0
    atr_tp1_mult: 1.5

  C:  # News-Driven Spike
    ema_fast: 3
    ema_slow: 10
    ema_long: 30
    ema_trend: 100
    rsi_low: 60
    rsi_high: 80
    vol_spike: 3.0
    atr_sl_mult: 0.8
    atr_tp1_mult: 2.0

  D:  # Volume Profile Scalping
    ema_fast: 5
    ema_slow: 15
    ema_long: 50
    ema_trend: 200
    rsi_low: 45
    rsi_high: 70
    vol_spike: 2.5
    atr_sl_mult: 0.7
    atr_tp1_mult: 1.2

  E:  # Liquidity Grab Reversal
    ema_fast: 9
    ema_slow: 21
    ema_long: 55
    ema_trend: 200
    rsi_low: 40
    rsi_high: 65
    vol_spike: 1.8
    atr_sl_mult: 1.5
    atr_tp1_mult: 1.3

walk_forward:
  default_method: rolling     # rolling | expanding | anchored
  train_months: 12
  test_months: 3
  n_folds: 8
  top_n_params: 10

monte_carlo:
  n_simulations: 1000
  confidence_levels: [5, 25, 50, 75, 95]

stress_tests:
  run_historical: true
  run_synthetic: true
  max_position_exposure: 0.06   # 6% max at SL

portfolio:
  allocation_methods:
    - equal
    - perf_weighted
    - inv_vol
    - kelly_optimal
  default_allocation: perf_weighted
  rebalance_frequency: monthly

validation:
  min_trades: 30
  min_sharpe: 0.5
  max_drawdown: 30.0
  min_win_rate: 0.40
  pbo_threshold: 0.5      # PBO > 0.5 = overfitting
  significance_level: 0.05
